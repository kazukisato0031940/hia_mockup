<div class="page" id="page-hia-list">
      <div style="display:flex;align-items:center;margin-bottom:20px;">
        <h1 class="page-title" style="margin-bottom:0;">受診勧奨対象者一覧</h1>
        <button class="btn-back" onclick="selectCategory('hia')" style="margin-left:auto;">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg>
          戻る
        </button>
      </div>
      <div class="main-wrapper">
        <!-- 検索条件card -->
        <div class="block">
          <h2 class="block-title" style="margin-bottom:0;">検索条件</h2>
          <div class="search-panel">
            <div class="search-group">
              <label>氏名・ID</label>
              <input type="text" id="fSearch" placeholder="氏名・IDで検索" oninput="applyFilter()">
            </div>
            <div class="search-group">
              <label>疾患カテゴリ</label>
              <select id="fRisk" onchange="applyFilter()"><option value="all">全疾患</option><option value="dm">糖尿病</option><option value="ckd">腎疾患</option><option value="cv">循環器</option></select>
            </div>
            <div class="search-group">
              <label>判定</label>
              <select id="fPrio" onchange="applyFilter()"><option value="all">全判定</option><option value="E">E（要受診勧奨）</option><option value="D">D（要治療）</option><option value="C">C（要生活改善）</option><option value="B">B（経過観察）</option><option value="A">A（良好）</option></select>
            </div>
            <div class="search-group">
              <label>ステータス</label>
              <select id="fStat" onchange="applyFilter()"><option value="all">全ステータス</option><option value="unsent">未勧奨</option><option value="sent">勧奨済</option></select>
            </div>
          </div>
        </div>

        <!-- テーブルcard -->
        <div class="block" style="gap:12px;">
          <div style="display:flex;align-items:center;gap:10px;">
            <h3 style="margin:0;font-size:13px;">受診勧奨対象者リスト</h3>
            <span style="font-size:12px;color:var(--txt2);" id="selCount">0名 選択中</span>
            <div style="margin-left:auto;display:flex;gap:8px;">
              <button class="btn-primary" type="button" onclick="openMailModal()">メール送信</button>
              <button class="btn-sm" onclick="exportCSV()">CSV出力</button>
            </div>
          </div>
          <div style="overflow-x:auto;">
            <table class="rtable" style="min-width:1060px;">
              <thead><tr>
                <th style="width:32px;text-align:center;"><input type="checkbox" id="chkAll" class="chk" onchange="toggleAll(this)" title="全選択 / 解除"></th>
                <th style="width:110px;">氏名 / ID</th>
                <th style="width:46px;text-align:center;">年齢</th>
                <th style="width:120px;">予測疾患</th>
                <th style="width:190px;">リスク根拠（主要健診値）</th>
                <th style="width:110px;">AIリスクスコア<br><span style="font-size:10px;font-weight:normal;color:#a0aec0;">（今年 / 前年 / 差分）</span></th>
                <th style="width:90px;text-align:center;">5年内発症確率</th>
                <th style="width:80px;text-align:center;">判定<br><span style="font-size:10px;font-weight:normal;color:#a0aec0;">（今年）</span></th>
                <th style="width:90px;text-align:center;">判定変化<br><span style="font-size:10px;font-weight:normal;color:#a0aec0;">（前年→今年）</span></th>
                <th style="width:70px;text-align:center;">勧奨回数</th>
                <th style="width:80px;text-align:center;">勧奨状況</th>
              </tr></thead>
              <tbody id="rtbody"></tbody>
            </table>
          </div>
        </div>
      </div>
    </div><!-- /#page-hia-list -->
