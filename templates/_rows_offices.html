{# 事業所一覧の行だけ #}
{% for r in rows %}
<tr class="ls-row" data-cname="{{ r.company_name }}" data-code="{{ r.code }}" data-name="{{ r.name }}">
  <td class="code">{{ r.ext_code or '—' }}</td>
  <td class="tl col-long" title="{{ r.name }}">{{ r.name }}</td>
  <td class="tl col-long" title="{{ r.address or '' }}">{{ r.address or '—' }}</td>
  <td class="tl">{{ r.tel or '—' }}</td>
  <td class="ops">
    {% if not CAN_MASTER %}<span class="hint">閲覧のみ</span>{% else %}
    <a class="btn-sm primary {{ 'btn-detail-blue' if SHELL == 'kenpo' else 'btn-edit' }}"
       href="{{ url_for('office_edit', oid=r.id) }}"
       style="text-decoration:none">{{ '詳細表示' if SHELL == 'kenpo' else '編集' }}</a>
    <form method="post" action="{{ url_for('office_delete', oid=r.id) }}" style="display:inline"
          onsubmit="return confirm('「{{ r.name }}」を削除します。よろしいですか？\n\n加入者が紐づいている場合は削除できません。')">
      <button class="btn-sm btn-del">削除</button></form>
    {% endif %}
  </td>
</tr>
{% endfor %}
{% if more is defined %}<tr class="ls-more" data-more="{{ more }}" hidden></tr>{% endif %}
