<script>
/* 健保 → 企業 → 事業所 → 部署 の連動選択。
   事業所は「対象の企業」で選んだ企業の配下だけ、部署は選んだ事業所の配下だけを表示する。
   親の選択が外れた行はチェックも自動で外す。テキスト絞り込みとも併用する。 */
(function(){
  var comp   = document.getElementById('compcard-list');
  var offBox = document.getElementById('sc-offs');
  var depBox = document.getElementById('sc-depts');
  if(!offBox || !depBox) return;
  var oq = document.getElementById('sc-oq');
  var dq = document.getElementById('sc-dq');
  var oEmpty = document.getElementById('sc-offs-empty');
  var dEmpty = document.getElementById('sc-depts-empty');

  function checkedVals(box, name){
    return new Set([].slice.call(
      box.querySelectorAll('input[name="' + name + '"]:checked'))
      .map(function(i){ return i.value; }));
  }
  function rows(box){ return [].slice.call(box.querySelectorAll('.chk-row')); }

  function refresh(box, parentSet, parentKey, q, emptyEl, noun, parentNoun){
    var qt = (q && q.value.trim().toLowerCase()) || '';
    var parentChosen = parentSet.size > 0;
    var visible = 0;
    rows(box).forEach(function(r){
      var underParent = parentChosen && parentSet.has(r.dataset[parentKey]);
      if(!underParent){
        var cb = r.querySelector('input');
        if(cb.checked) cb.checked = false;
      }
      var hit = underParent && (!qt || (r.dataset.text || '').toLowerCase().indexOf(qt) >= 0);
      r.style.display = hit ? '' : 'none';
      if(hit) visible++;
    });
    if(emptyEl){
      emptyEl.style.display = visible ? 'none' : '';
      emptyEl.textContent = !parentChosen
        ? ('先に' + parentNoun + 'を選択してください。')
        : (qt ? ('「' + q.value.trim() + '」に一致する' + noun + 'はありません。')
              : ('選択した' + parentNoun + 'に' + noun + 'がありません。'));
    }
  }

  function counts(){
    document.getElementById('sc-o-n').textContent =
      offBox.querySelectorAll('input:checked').length;
    document.getElementById('sc-d-n').textContent =
      depBox.querySelectorAll('input:checked').length;
  }
  function syncDepts(){
    refresh(depBox, checkedVals(offBox, 'office_ids'), 'office', dq, dEmpty, '部署', '事業所');
    counts();
  }
  function syncOffices(){
    refresh(offBox, checkedVals(comp, 'company_ids'), 'company', oq, oEmpty, '事業所', '企業');
    syncDepts();
  }

  comp && comp.addEventListener('change', syncOffices);
  offBox.addEventListener('change', syncDepts);
  depBox.addEventListener('change', counts);
  oq && oq.addEventListener('input', syncOffices);
  dq && dq.addEventListener('input', syncDepts);

  window.scUpd = syncOffices;   /* 企業選択・ロール切替からも呼ばれる */
  syncOffices();
})();
</script>
